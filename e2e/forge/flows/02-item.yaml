# Forge drop-in proof (cq 056) 2/4, items: a Forge weapon found on the map
# (the server's spawn rules put it there), claimed in reach with the reward
# moment, equipped, and in the bag. DROP_NAME is the find the phone was
# walked to (e2e/forge/proof.sh picks the nearest live one).
appId: com.dammy0227.cosquest
name: F02 Forge find, claim, equip
---
- launchApp
- runFlow: ../../maestro/common/game.yaml
- runFlow: coach-away.yaml
- extendedWaitUntil:
    visible: "Forge find: ${DROP_NAME}.*"
    timeout: 90000
- takeScreenshot: f02-map-find
- tapOn:
    text: "Forge find: ${DROP_NAME}.*"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Claim this Forge find"
    timeout: 15000
- extendedWaitUntil:
    visible: "never-on-screen-wait"
    timeout: 8000
    optional: true
- takeScreenshot: f02-find-3d
- tapOn:
    text: "Claim this Forge find"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "YOURS NOW|ANOTHER ONE"
    timeout: 20000
- extendedWaitUntil:
    visible: "never-on-screen-wait"
    timeout: 2500
    optional: true
- takeScreenshot: f02-claimed
- tapOn:
    text: "Equip this weapon"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "never-on-screen-wait"
    timeout: 3000
    optional: true
- takeScreenshot: f02-equipped-chip
- tapOn:
    id: "forge-hud-chip"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Unequip"
    timeout: 15000
- extendedWaitUntil:
    visible: "never-on-screen-wait"
    timeout: 5000
    optional: true
- takeScreenshot: f02-bag
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 1500
